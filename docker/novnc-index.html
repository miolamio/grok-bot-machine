<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grok-bot desk</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e2330; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #bar {
    display: none;
    position: fixed;
    left: 0; right: 0; top: 0;
    z-index: 9;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: #2a1608;
    color: #fff7ed;
    font: 14px/1.3 ui-sans-serif, system-ui, sans-serif;
    box-shadow: 0 2px 0 #ff5c00;
  }
  #bar b { font-weight: 700; letter-spacing: 0.01em; }
  #bar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar button {
    border: 0;
    border-radius: 6px;
    padding: 8px 14px;
    background: #ff5c00;
    color: #fff;
    font: 700 14px/1.2 ui-sans-serif, system-ui, sans-serif;
    cursor: pointer;
    animation: pulse 1.4s ease-in-out infinite;
  }
  #bar button:disabled { opacity: 0.5; cursor: default; animation: none; }
  #bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 92, 0, 0.55); }
    50% { box-shadow: 0 0 0 7px rgba(255, 92, 0, 0); }
  }
</style>
<iframe src="vnc.html?autoconnect=1&amp;resize=off" title="desktop"></iframe>
<div id="bar" role="status" aria-live="assertive">
  <b>Human has the desk</b>
  <span id="msg"></span>
  <button type="button" id="back">Give back to agent</button>
</div>
<script>
(function () {
  var host = location.hostname === "localhost" ? "localhost" : "127.0.0.1";
  var api = "http://" + host + ":7070";
  var bar = document.getElementById("bar");
  var msg = document.getElementById("msg");
  var btn = document.getElementById("back");
  var baseTitle = document.title;
  var wasOn = false;
  var titleFlip = false;
  var titleTimer = null;
  var audioCtx = null;
  var chimeAt = 0;
  var alertText = "";

  function unlockAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  document.addEventListener("pointerdown", unlockAudio);
  document.addEventListener("keydown", unlockAudio);
  window.addEventListener("focus", unlockAudio);

  function chime() {
    try {
      unlockAudio();
      if (!audioCtx || audioCtx.state !== "running") return;
      var t = audioCtx.currentTime;
      var notes = [880, 1175];
      for (var i = 0; i < notes.length; i++) {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = notes[i];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.12, t + 0.02 + i * 0.11);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26 + i * 0.11);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(t + i * 0.11);
        o.stop(t + 0.3 + i * 0.11);
      }
    } catch (e) {}
  }

  function startTitle(text) {
    alertText = text;
    if (titleTimer) return;
    document.title = "⚠ " + text;
    titleTimer = setInterval(function () {
      titleFlip = !titleFlip;
      document.title = titleFlip ? baseTitle : "⚠ " + alertText;
    }, 1000);
  }

  function stopTitle() {
    if (titleTimer) {
      clearInterval(titleTimer);
      titleTimer = null;
    }
    titleFlip = false;
    document.title = baseTitle;
  }

  function ping(text) {
    var now = Date.now();
    if (now - chimeAt < 12000) return;
    chimeAt = now;
    chime();
    if (window.Notification && Notification.permission === "granted") {
      try {
        new Notification("Human needed on the desk", { body: text, tag: "gbm-handoff" });
      } catch (e) {}
    }
  }

  function show(h) {
    var text = h.instruction + (h.reason ? " (" + h.reason + ")" : "");
    bar.style.display = "flex";
    msg.textContent = text;
    startTitle(text);
    if (!wasOn) {
      chimeAt = 0;
      ping(text);
      if (window.Notification && Notification.permission === "default") {
        try { Notification.requestPermission(); } catch (e) {}
      }
    } else {
      ping(text);
    }
    wasOn = true;
  }

  function hide() {
    bar.style.display = "none";
    msg.textContent = "";
    stopTitle();
    wasOn = false;
    chimeAt = 0;
  }

  function tick() {
    fetch(api + "/handoff/public")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var h = j && j.handoff;
        if (h && h.instruction) show(h);
        else hide();
      })
      .catch(function () {});
  }

  btn.addEventListener("click", function () {
    unlockAudio();
    btn.disabled = true;
    fetch(api + "/handoff/resume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    })
      .then(function () { tick(); })
      .catch(function () {})
      .then(function () { btn.disabled = false; });
  });

  tick();
  setInterval(tick, 1500);
})();
</script>
</html>
